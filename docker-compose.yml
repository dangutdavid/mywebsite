services:
  postgres:
    image: postgres:16-alpine
    container_name: skydive-leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skydive
      POSTGRES_USER: skydive
      POSTGRES_PASSWORD: skydive_dev_password
    ports:
      - "5434:5432"
    volumes:
      - skydive-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  skydive-postgres-data:

